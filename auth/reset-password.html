<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="/images/favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Classicalia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/version2/assets/css/classicalia.css">
<script>
  // Grab the recovery parameters before supabase-js (or anything else) clears the URL.
  window.__recoveryParams = (function () {
    var hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    var query = new URLSearchParams(window.location.search.replace(/^\?/, ''));
    return {
      get: function (name) { return hash.get(name) || query.get(name); },
      hasAny: !!(hash.toString() || query.toString())
    };
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-body">

<div class="dash-header" style="padding:80px 0 60px;">
  <canvas class="header-sky" data-starfield data-seed="999" data-region="0.8"></canvas>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/version2/" class="nav-logo"><img src="/version2/assets/images/classicalia-wordmark.png" alt="Classicalia"></a>
      <div class="nav-links">
        <a href="/version2/subjects/latin/" class="nav-link">Latin</a>
        <a href="/version2/subjects/greek/" class="nav-link">Greek</a>
        <a href="/version2/subjects/classical-civilisation/" class="nav-link">Class. Civ.</a>
        <div class="nav-div"></div>
        <a href="/auth/login.html" class="nav-cta">Sign in</a>
      </div>
    </div>
  </nav>
  <div style="max-width:480px;margin:0 auto;padding:0 24px;position:relative;z-index:2;">
    <div class="dash-eyebrow">Reset password</div>
    <div class="dash-title" style="font-size:36px;">Set a new password</div>
    <div class="dash-subtitle">Pick something memorable but not something you've used elsewhere.</div>
  </div>
</div>

<div class="auth-wrap">
  <div class="auth-card">

    <div id="loading" class="auth-hint" style="text-align:center;padding:18px 0;">Verifying your reset link&hellip;</div>

    <div id="message" class="auth-message"></div>

    <form id="resetForm" class="hidden">
      <div class="auth-field">
        <label for="password" class="auth-label">New password</label>
        <input type="password" id="password" name="password" class="auth-input" required placeholder="Enter new password" minlength="6" autocomplete="new-password">
        <span class="auth-hint">At least 6 characters.</span>
      </div>

      <div class="auth-field">
        <label for="confirmPassword" class="auth-label">Confirm new password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" class="auth-input" required placeholder="Confirm new password" minlength="6" autocomplete="new-password">
      </div>

      <button type="submit" class="auth-submit" id="submitBtn">Update password</button>
    </form>

    <div class="auth-foot">
      <div><a href="forgot-password.html">Request a new reset link</a></div>
      <div class="auth-foot-sep">·</div>
      <div><a href="login.html">Back to sign in</a></div>
      <div class="auth-foot-sep">·</div>
      <div><a href="/version2/">&larr; Back to Classicalia</a></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="/version2/assets/js/starfield.js"></script>
<script>
  const form = document.getElementById('resetForm');
  const messageDiv = document.getElementById('message');
  const submitBtn = document.getElementById('submitBtn');
  const loadingDiv = document.getElementById('loading');

  function showMessage(text, type) {
    messageDiv.textContent = text;
    messageDiv.className = 'auth-message ' + type;
  }

  function showForm() {
    loadingDiv.classList.add('hidden');
    form.classList.remove('hidden');
    messageDiv.textContent = '';
    messageDiv.className = 'auth-message';
  }

  function showLinkProblem(text) {
    loadingDiv.classList.add('hidden');
    form.classList.add('hidden');
    showMessage(text || 'This password reset link is invalid or has expired. Please request a new one.', 'error');
  }

  // Take the tokens out of the address bar once we have used them.
  function cleanUrl() {
    if (window.history && window.history.replaceState) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  }

  async function hasSession() {
    const { data: { session } } = await supabase.auth.getSession();
    return !!session;
  }

  async function establishRecoverySession() {
    const params = window.__recoveryParams;

    // 1. Supabase reported a problem with the link itself.
    const errorCode = params.get('error_code') || params.get('error');
    if (errorCode) {
      const description = params.get('error_description');
      if (/expired/i.test(errorCode) || /expired/i.test(description || '')) {
        return { ok: false, message: 'This reset link has expired. Reset links last one hour and can only be used once, so please request a new one.' };
      }
      return { ok: false, message: description ? decodeURIComponent(description.replace(/\+/g, ' ')) : null };
    }

    // 2. Newer email templates: ?token_hash=...&type=recovery. Works in any browser.
    const tokenHash = params.get('token_hash') || params.get('token');
    const type = params.get('type');
    if (tokenHash && (!type || type === 'recovery')) {
      const { error } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' });
      // supabase-js may have already spent the token itself, which reads as an error.
      if (error) return (await hasSession()) ? { ok: true } : { ok: false, message: error.message };
      return { ok: true };
    }

    // 3. Implicit flow: #access_token=...&refresh_token=...
    const accessToken = params.get('access_token');
    const refreshToken = params.get('refresh_token');
    if (accessToken && refreshToken) {
      const { error } = await supabase.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      });
      if (error) return (await hasSession()) ? { ok: true } : { ok: false, message: error.message };
      return { ok: true };
    }

    // 4. PKCE flow: ?code=... only works in the browser that asked for the link.
    const code = params.get('code');
    if (code && supabase.auth.exchangeCodeForSession) {
      const { error } = await supabase.auth.exchangeCodeForSession(code);
      if (error) {
        if (await hasSession()) return { ok: true };
        return { ok: false, message: 'This reset link has to be opened in the same browser you requested it from. Please request a new link and open it here.' };
      }
      return { ok: true };
    }

    // 5. supabase-js may have already consumed the URL for us.
    const { data: { session } } = await supabase.auth.getSession();
    if (session) return { ok: true };

    await new Promise(function (resolve) { setTimeout(resolve, 1200); });
    const { data: { session: delayed } } = await supabase.auth.getSession();
    if (delayed) return { ok: true };

    return { ok: false, message: null };
  }

  document.addEventListener('DOMContentLoaded', async function () {
    let settled = false;

    supabase.auth.onAuthStateChange(function (event, session) {
      if (!settled && session && (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN')) {
        settled = true;
        showForm();
      }
    });

    let result;
    try {
      result = await establishRecoverySession();
    } catch (err) {
      console.error('Password recovery error:', err);
      result = { ok: false, message: null };
    }

    if (settled) { cleanUrl(); return; }
    settled = true;

    if (result.ok) {
      showForm();
    } else {
      showLinkProblem(result.message);
    }
    cleanUrl();
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
      showMessage('Passwords do not match.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating…';

    const result = await updatePassword(password);

    if (result.success) {
      showMessage('Password updated. Redirecting to sign in…', 'success');
      submitBtn.textContent = 'Password updated';
      setTimeout(async function () {
        await signOut();
        window.location.href = 'login.html';
      }, 2000);
    } else {
      showMessage(result.error, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update password';
    }
  });
</script>
</body>
</html>
