<style>
body { background: var(--cream); }
.gf-wrap { max-width: 760px; margin: 0 auto; padding: 28px 16px 80px; }
.gf-banner { background: var(--navy); color: #fff; border-radius: 10px; padding: 12px 16px; font-size: 14px; margin-bottom: 16px; }
.gf-banner strong { font-weight: 700; }
.gf-card { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 22px 22px; margin-bottom: 16px; }
.gf-title { font-family: 'Lora', serif; font-style: italic; font-weight: 700; font-size: 22px; color: var(--navy); margin: 0 0 6px; }
.gf-sub { color: var(--muted); font-size: 14px; margin: 0; line-height: 1.5; }
.gf-label { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.gf-bank { display: flex; flex-wrap: wrap; gap: 8px; }
.gf-chip { font-family: inherit; font-size: 14px; font-weight: 600; color: var(--navy); background: var(--cream); border: 1px solid var(--rule); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
.gf-chip:hover { border-color: var(--brand); }
.gf-chip.used { opacity: 0.4; text-decoration: line-through; }
.gf-list { list-style: none; margin: 0; padding: 0; counter-reset: gf; }
.gf-item { counter-increment: gf; padding: 14px 0; border-bottom: 1px solid var(--rule-faint); display: flex; gap: 12px; }
.gf-item:last-child { border-bottom: none; }
.gf-item::before { content: counter(gf); font-family: 'Lora', serif; font-weight: 700; color: var(--brand); min-width: 22px; font-size: 16px; }
.gf-body { flex: 1; min-width: 0; }
.gf-q { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
.gf-line { font-size: 16.5px; color: var(--ink); line-height: 2; }
.gf-line b { color: var(--navy); }
.gf-gap { font-family: inherit; font-size: 15.5px; color: var(--navy); border: none; border-bottom: 2px solid var(--brand); background: #f2f6ff; border-radius: 4px 4px 0 0; padding: 2px 6px; width: 11em; max-width: 100%; outline: none; }
.gf-gap:focus { background: #e6eeff; }
.gf-gap.right { border-bottom-color: #16a34a; background: #f0fdf4; }
.gf-gap.wrong { border-bottom-color: #dc2626; background: #fef2f2; }
.gf-fix { display: block; font-size: 13px; color: #b91c1c; margin-top: 2px; }
.gf-fix.ok { color: #15803d; }
.gf-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.gf-btn { font-family: inherit; font-size: 14px; font-weight: 700; padding: 11px 18px; border-radius: 8px; border: 1px solid var(--rule); background: #fff; color: var(--ink); cursor: pointer; }
.gf-btn:hover { border-color: var(--navy); }
.gf-btn-primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.gf-btn-primary:hover { opacity: 0.9; border-color: var(--brand); }
.gf-score { font-family: 'Lora', serif; font-weight: 700; font-size: 20px; color: var(--navy); }
.gf-msg a { color: var(--brand); font-weight: 700; }
.hidden { display: none !important; }

<body>
<div data-shell="header"></div>

<div class="gf-wrap">
  <div class="gf-banner hidden" id="gfBanner"></div>
  <div class="gf-card" id="gfIntro">
    <h1 class="gf-title">Do Now: gap fill</h1>
    <p class="gf-sub gf-msg" id="gfMsg">Finding your class’s Do Now…</p>
  </div>
  <div class="gf-card hidden" id="gfBankCard">
    <div class="gf-label">Word bank</div>
    <div class="gf-bank" id="gfBank"></div>
  </div>
  <div class="gf-card hidden" id="gfSheet">
    <ol class="gf-list" id="gfList"></ol>
  </div>
  <div class="gf-actions hidden" id="gfActions">
    <button class="gf-btn gf-btn-primary" id="gfCheck" type="button">Check answers</button>
    <button class="gf-btn hidden" id="gfAgain" type="button">Try another set</button>
    <span class="gf-score" id="gfScore"></span>
  </div>
</div>

<div data-shell="footer"></div>

<script>
// ═══════════════════════════════════════════════════════
// Do Now gap fill. Opened by a tester in ?mode=donow when the teacher set
// the Do Now's format to 'gapfill' (migration 088). Builds a short
// worksheet from the same questions / vocabulary the quiz would use, each
// with one word missing, and optionally shows a shuffled word bank.
// Scores are logged to vocab_sessions under the Do Now's vocab_list, so the
// teacher's live results and class view count them like a quiz.
// ═══════════════════════════════════════════════════════
const sb = window.supabase;
const SET_SIZE = 10;
const KNOWN_LISTS = ['civ-myth-religion', 'civ-homeric-world', 'latin-gcse', 'latin-suburani'];

const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function message(html){ $('gfMsg').innerHTML = html; $('gfIntro').classList.remove('hidden'); }

// ── marking ──
function norm(s){
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/\([^)]*\)/g, ' ').replace(/[\-./…]+/g, ' ')
    .replace(/[^\p{L}\p{N}\s]/gu, '').replace(/\s+/g, ' ').trim();
}
// One slip (a missing, extra, swapped or wrong letter) is forgiven on
// longer words, so a spelling wobble isn't marked as not knowing it.
function nearlyEqual(a, b){
  if (a === b) return true;
  if (Math.min(a.length, b.length) < 5 || Math.abs(a.length - b.length) > 1) return false;
  const m = a.length, n = b.length, d = [];
  for (let i = 0; i <= m; i++) { d[i] = [i]; }
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 1);
  }
  return d[m][n] <= 1;
}
// Latin meanings: any comma/semicolon-separated gloss counts, as in the
// vocab tester's typed mode ("to love" matches "love", "loves" ≈ "love").
function meaningMatch(input, english){
  const u = norm(input); if (!u) return false;
  const uC = u.replace(/\s/g, ''), uW = new Set(u.split(' '));
  let vars = String(english).split(/[,;]/).map(norm).filter(Boolean);
  if (!vars.length) vars = String(english).replace(/[()\[\]]/g, ' ').split(/[,;]/).map(norm).filter(Boolean);
  for (const v of vars) {
    const vC = v.replace(/\s/g, '');
    if (u === v || uC === vC || nearlyEqual(uC, vC)) return true;
    const vW = v.split(' ').filter(Boolean);
    if (vW.length && vW.every(w => uW.has(w))) return true;
    if (vW.length && vW.every(w => w.length >= 4 && uC.includes(w))) return true;
  }
  return false;
}

// ── building the gaps ──
const STOP = new Set('the a an and or but of to in on at by for from with as is are was were be been his her their its it they them he she him this that these those which who whom what when where why how not no so than then there into onto over under about after before because only also very more most many much some any all each every would could should might must may can will shall did does do had has have being own other such same just'.split(' '));

// Pick the word to blank out of a Civ answer: the longest content word,
// avoiding figures, with a nudge towards names (a capital letter mid-answer), which are the
// key knowledge more often than not.
function pickGap(answer){
  const tokens = String(answer).split(/(\s+)/);
  let best = -1, bestScore = -Infinity;
  tokens.forEach((tok, i) => {
    const core = tok.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
    if (!core || STOP.has(core.toLowerCase())) return;
    // Short words and figures (dates, measurements) only when nothing better.
    const score = core.length + (/^\p{Lu}/u.test(core) && i > 0 ? 3 : 0) - (/\d/.test(core) ? 8 : 0) - (core.length < 3 ? 10 : 0);
    if (score > bestScore) { bestScore = score; best = i; }
  });
  if (best < 0) return null;
  const tok = tokens[best];
  const m = tok.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
  return {
    before: tokens.slice(0, best).join('') + m[1],
    word: m[2],
    after: m[3] + tokens.slice(best + 1).join('')
  };
}

function civTopicsFor(list){
  if (list === 'civ-myth-religion') return (window.CivQuiz && window.CivQuiz.topics) || [];
  if (list === 'civ-homeric-world') return (window.HomericQuiz && window.HomericQuiz.topics) || [];
  return [];
}
function latinVocab(list){
  if (list === 'latin-suburani') return (typeof VOCAB_SUBURANI !== 'undefined') ? VOCAB_SUBURANI : [];
  return (typeof VOCAB_LATIN_GCSE !== 'undefined') ? VOCAB_LATIN_GCSE : [];
}

// Every possible item for this Do Now. An item is
// { q?, before, after, answer, bank, check(input) }.
function buildPool(dn){
  if (dn.vocab_list.startsWith('latin-')) {
    let words = latinVocab(dn.vocab_list).filter(w => w.chapter > 0);
    if (Array.isArray(dn.subtopics) && dn.subtopics.length) {
      const set = new Set(dn.subtopics.map(Number));
      words = words.filter(w => set.has(w.chapter));
    }
    const seen = new Set();
    words = words.filter(w => { if (seen.has(w.latin)) return false; seen.add(w.latin); return true; });
    return words.map(w => {
      const first = (String(w.english).split(/[,;]/)[0] || w.english).replace(/\([^)]*\)/g, '').trim() || w.english;
      return {
        latin: w.latin, before: '', after: '', answer: w.english, bank: first,
        check: input => meaningMatch(input, w.english)
      };
    });
  }
  const t = civTopicsFor(dn.vocab_list).find(x => x.id === dn.topic_id);
  if (!t) return null;
  let qs = t.questions;
  if (Array.isArray(dn.subtopics) && dn.subtopics.length) {
    const set = new Set(dn.subtopics);
    const picked = qs.filter(q => set.has(q.subtopic));
    if (picked.length) qs = picked;
  }
  const items = [];
  for (const q of qs) {
    const g = pickGap(q.answers && q.answers[0]);
    if (!g) continue;
    const target = norm(g.word).replace(/\s/g, '');   // spaces/dashes don't matter: "she wolf" = "she-wolf"
    items.push({ q: q.q, before: g.before, after: g.after, answer: g.word, bank: g.word,
                 check: input => { const u = norm(input).replace(/\s/g, ''); return !!u && (u === target || nearlyEqual(u, target)); } });
  }
  return { items, topic: t };
}

// ── state ──
let dn = null, pool = [], sheet = [], checked = false, userId = null;
let log = { id: null, answered: 0, correct: 0 };
let watch = null;

async function flushLog(){
  if (!userId || !log.answered) return;
  const now = new Date().toISOString();
  try {
    if (!log.id) {
      const { data, error } = await sb.from('vocab_sessions')
        .insert({ student_id: userId, vocab_list: dn.vocab_list, answered: log.answered, correct: log.correct, last_answer_at: now })
        .select('id').single();
      if (!error && data) log.id = data.id;
    } else {
      await sb.from('vocab_sessions').update({ answered: log.answered, correct: log.correct, last_answer_at: now }).eq('id', log.id);
    }
  } catch (_e) {}
}

function newSheet(){
  // Keep the gaps on one sheet distinct, so the word bank has no doubles.
  const out = [], used = new Set();
  for (const it of shuffle(pool)) {
    const k = norm(it.bank);
    if (used.has(k)) continue;
    used.add(k); out.push(it);
    if (out.length >= SET_SIZE) break;
  }
  sheet = out; checked = false;
  renderSheet();
}

function renderSheet(){
  const list = $('gfList');
  list.innerHTML = sheet.map((it, i) => {
    const gap = `<input class="gf-gap" data-i="${i}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Gap ${i + 1}">`;
    const line = it.latin
      ? `<b>${esc(it.latin)}</b> means ${gap}`
      : `${esc(it.before)}${gap}${esc(it.after)}`;
    return `<li class="gf-item"><div class="gf-body">${it.q ? `<div class="gf-q">${esc(it.q)}</div>` : ''}<div class="gf-line">${line}</div><span class="gf-fix hidden" id="gfFix${i}"></span></div></li>`;
  }).join('');
  $('gfSheet').classList.remove('hidden');
  $('gfActions').classList.remove('hidden');
  $('gfCheck').classList.remove('hidden');
  $('gfAgain').classList.add('hidden');
  $('gfScore').textContent = '';

  if (dn.word_bank) {
    $('gfBank').innerHTML = shuffle(sheet.map(it => it.bank)).map(w => `<button class="gf-chip" type="button">${esc(w)}</button>`).join('');
    $('gfBankCard').classList.remove('hidden');
  } else {
    $('gfBankCard').classList.add('hidden');
  }

  const gaps = Array.from(list.querySelectorAll('.gf-gap'));
  gaps.forEach((g, i) => {
    g.addEventListener('input', markBankUsed);
    g.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (gaps[i + 1]) gaps[i + 1].focus(); else if (!checked) checkSheet();
    });
    g.addEventListener('focus', () => { lastFocus = g; });
  });
  lastFocus = null;
  if (gaps[0] && window.matchMedia('(pointer: fine)').matches) gaps[0].focus();
}

// Tapping a word in the bank drops it into the gap you were on (or the
// first empty one), so the bank also works well on a phone.
let lastFocus = null;
$('gfBank').addEventListener('click', e => {
  const chip = e.target.closest('.gf-chip');
  if (!chip || checked) return;
  const gaps = Array.from(document.querySelectorAll('.gf-gap'));
  const target = (lastFocus && !lastFocus.value) ? lastFocus : (gaps.find(g => !g.value.trim()) || lastFocus);
  if (!target) return;
  target.value = chip.textContent;
  markBankUsed();
  const next = gaps.find(g => !g.value.trim());
  if (next) next.focus(); else target.focus();
});
function markBankUsed(){
  const typed = new Map();
  document.querySelectorAll('.gf-gap').forEach(g => { const k = norm(g.value); if (k) typed.set(k, (typed.get(k) || 0) + 1); });
  document.querySelectorAll('.gf-chip').forEach(c => {
    const k = norm(c.textContent), n = typed.get(k) || 0;
    c.classList.toggle('used', n > 0);
    if (n > 0) typed.set(k, n - 1);
  });
}

function checkSheet(){
  if (checked) return;
  checked = true;
  let right = 0;
  document.querySelectorAll('.gf-gap').forEach(g => {
    const i = +g.dataset.i, it = sheet[i], ok = it.check(g.value);
    g.readOnly = true;
    g.classList.add(ok ? 'right' : 'wrong');
    const fix = $('gfFix' + i);
    if (ok) { right++; if (norm(g.value) !== norm(it.answer) && !it.latin) { fix.textContent = '✓ ' + it.answer; fix.className = 'gf-fix ok'; } }
    else { fix.textContent = 'Answer: ' + it.answer; fix.className = 'gf-fix'; }
  });
  log.answered += sheet.length; log.correct += right;
  flushLog();
  $('gfScore').textContent = right + ' / ' + sheet.length;
  $('gfCheck').classList.add('hidden');
  if (dn) $('gfAgain').classList.remove('hidden');
}

$('gfCheck').addEventListener('click', checkSheet);
$('gfAgain').addEventListener('click', () => { newSheet(); window.scrollTo({ top: 0, behavior: 'smooth' }); });

async function fetchDoNow(list){
  try { const { data } = await sb.rpc('get_my_do_now', { p_vocab_list: list }); return (data && data.ok) ? data : null; }
  catch (_e) { return null; }
}

function stop(reason){
  if (watch) { clearInterval(watch); watch = null; }
  if (!checked && sheet.length) checkSheet();
  $('gfAgain').classList.add('hidden');
  dn = null;
  $('gfBanner').classList.add('hidden');
  message(esc(reason) + ' Your answers have been marked below. <a href="/donow/">Check for a new Do Now</a>.');
}

async function watchDoNow(){
  if (!dn) return;
  let res = null;
  try { const { data, error } = await sb.rpc('get_my_do_now', { p_vocab_list: dn.vocab_list }); if (!error) res = data; }
  catch (_e) { return; }   // network blip: don't cut the student off
  if (!res) return;
  if (!res.ok) stop('Your teacher has stopped the Do Now.');
  else if (res.updated_at !== dn.updated_at) stop('Your teacher has started a new Do Now.');
}

(async function init(){
  try {
    const { data } = await sb.auth.getUser();
    userId = data && data.user ? data.user.id : null;
  } catch (_e) {}
  if (!userId) { message('Sign in so we can find the Do Now your teacher has set. <a href="/auth/login.html?next=' + encodeURIComponent(location.pathname + location.search) + '">Sign in</a>'); return; }

  const asked = (new URLSearchParams(location.search).get('list') || '').split(',').filter(l => KNOWN_LISTS.includes(l));
  const found = (await Promise.all((asked.length ? asked : KNOWN_LISTS).map(fetchDoNow))).filter(Boolean)
    .sort((a, b) => String(b.updated_at || '').localeCompare(String(a.updated_at || '')));
  if (!found.length) { message('Your teacher hasn’t set a Do Now yet. <a href="/donow/">Check again</a>.'); return; }
  dn = found[0];

  const built = buildPool(dn);
  pool = Array.isArray(built) ? built : (built ? built.items : []);
  if (pool.length < 2) { message('There aren’t enough questions in today’s Do Now to make a gap fill.'); return; }

  let label = dn.topic_id || '';
  if (built && !Array.isArray(built) && built.topic) label = 'Topic ' + built.topic.id + ' — ' + built.topic.title;
  $('gfBanner').innerHTML = "<strong>Today's Do Now</strong> &middot; " + esc(dn.class_name || 'your class') + (label ? ' &middot; ' + esc(label) : '');
  $('gfBanner').classList.remove('hidden');
  $('gfMsg').textContent = dn.vocab_list.startsWith('latin-')
    ? 'Type the English meaning of each Latin word' + (dn.word_bank ? ', using the word bank to help.' : '.') + ' Press Enter to move to the next gap.'
    : 'Fill in the missing word in each answer' + (dn.word_bank ? ', using the word bank to help.' : '.') + ' Press Enter to move to the next gap.';

  newSheet();
  watch = setInterval(watchDoNow, 12000);
})();

window.addEventListener('beforeunload', () => { if (watch) clearInterval(watch); flushLog(); });
</script>
</body>
</html>
